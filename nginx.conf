# =============================================================================
#  Nibula — default nginx site configuration
#  Static site + optional HTTP backend on 127.0.0.1:3000. PHP not handled.
# -----------------------------------------------------------------------------
#  REPLACE
#    YOUR_DOMAIN        server_name, twice (port 80 and 443)
#    SITE_FOLDER        document root under /var/www/
#    YOUR_CERTIFICATE   dir under /etc/letsencrypt/live/ — not always the same
#                       as YOUR_DOMAIN. Check: sudo certbot certificates
#
#  REQUIRES
#    valid certificate covering YOUR_DOMAIN
#    /var/www/SITE_FOLDER/404.html readable by nginx
#    nginx >= 1.25 for the http2 directive
#
#  ENABLE
#    sudo ln -s /etc/nginx/sites-available/FILE /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    curl -I https://YOUR_DOMAIN/nonexistent          # expect 404
#
#  IF IT FAILS
#    "cannot load certificate ... Permission denied"  → run nginx -t with sudo
#    500 instead of 404                               → 404.html missing
# =============================================================================

### HTTP -> HTTPS redirect
server {
    listen      80;
    listen      [::]:80;
    server_name YOUR_DOMAIN;

    # Webroot ACME renewal; drop if using the nginx authenticator.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
### Essentials
    listen      443 ssl;
    listen      [::]:443 ssl;

    # nginx >= 1.25; older: "listen 443 ssl http2;"
    http2       on;

    server_name YOUR_DOMAIN;
    root        /var/www/SITE_FOLDER;
    index       index.html;

### Certificate
    ssl_certificate     /etc/letsencrypt/live/YOUR_CERTIFICATE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_CERTIFICATE/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

### Security headers
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # HSTS persists in browsers for max-age even if removed here. Raise to
    # 31536000 once stable; "; includeSubDomains" needs HTTPS on all subdomains.
    add_header Strict-Transport-Security "max-age=300" always;

    server_tokens off;
    autoindex     off;

### Blocked paths
    error_page 403 404 /404.html;

    location ^~ /backend/ {
        return 404;
    }

    location ~* ^/(web\.config)$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # PHP not handled: without php-fpm these would leak source code.
    # For PHP sites, replace this block with fastcgi_pass and change
    # try_files below to: $uri $uri/ /index.php?$query_string
    location ~ \.php$ {
        return 404;
    }

### API backend
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy_read_timeout defaults to 60s; raise only for slow endpoints.
        proxy_connect_timeout 5s;

        # WebSocket is not enabled; needs a $connection_upgrade map at http level.
    }

### Static files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

### Error page
    location = /404.html {
        internal;
    }
}